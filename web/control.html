<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stimuli control</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; font-family: system-ui, sans-serif; color: #fff; }
      main { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 24px; max-width: 640px; margin: 0 auto; padding: 32px 24px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; color: #aaa; }
      #value { font: bold 96px ui-monospace, Menlo, Consolas, monospace; line-height: 1; }
      input[type=range] { width: 100%; height: 40px; accent-color: #2f6; }
      p { margin: 0; color: #aaa; line-height: 1.5; }
      #status.error { color: #ff4466; }
    </style>
  </head>
  <body>
    <main>
      <h1>Stimuli reaching the participant</h1>
      <div id="value">100%</div>
      <input id="slider" type="range" min="0" max="100" step="1" value="100" aria-label="Stimuli in percent" />
      <p>The share of detected boxes (objects and faces) shown in the headset.</p>
      <p id="status">Connecting…</p>
    </main>
    <script type="module">
      const slider = document.getElementById('slider');
      const value = document.getElementById('value');
      const status = document.getElementById('status');
      const show = (percent) => {
        slider.value = percent;
        value.textContent = `${percent}%`;
      };
      const report = (ok, text) => {
        status.textContent = text;
        status.classList.toggle('error', !ok);
      };

      fetch('/stimuli')
        .then((res) => res.json())
        .then(({ percent }) => {
          show(percent);
          report(true, 'Connected.');
        })
        .catch((err) => report(false, `Dev server unreachable: ${err.message}`));

      slider.addEventListener('input', async () => {
        show(Number(slider.value));
        try {
          const res = await fetch('/stimuli', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ percent: Number(slider.value) }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          report(true, 'Connected.');
        } catch (err) {
          report(false, `Could not set the value: ${err.message}`);
        }
      });
    </script>
  </body>
</html>
